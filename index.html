<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Water Splash</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="loadingScreen" style="position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.28);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);transition:opacity .35s ease,visibility .35s ease;">
<div class="loadingText" style="padding:14px 22px;border-radius:999px;background:rgba(255,255,255,.9);color:#333;font-size:16px;font-weight:600;letter-spacing:.04em;box-shadow:0 4px 20px rgba(0,0,0,.15);">スライム生成中…</div>
</div>
<div id="app">
<img id="background" src="IMG_5503.png" alt="">
<canvas id="waterCanvas"></canvas>
<div class="top-ui">
<label class="button">背景を変更<input id="backgroundInput" type="file" accept="image/*" hidden></label>
<button id="resetButton" class="button">リセット</button>
</div>
<div class="control-panel">
<div class="water-title">
<span>サイズ</span>
<span id="waterValue">35%</span>
</div>
<input id="waterAmount" type="range" min="10" max="100" value="35">
<footer class="app-footer">
<a href="https://quietroom-dev.github.io/QuietRoom/" target="_blank" rel="noopener noreferrer">
<strong>アプリ紹介✨</strong>
<span>誰かわからん通話</span>
<span>モザイク・無音だから安心して繋がれる</span>
</a>
</footer>
</div>
</div>
<script src="app.js"></script>
</body>
</html>
